plugins {
    id 'flink-training-developer'
}

dependencies {
    implementation project(path: ':common')
    testImplementation project(':common')
    testImplementation testFixtures(project(':common'))

    // TODO - shadow isn't working, because I'm not able to set up the id
    shadow "org.apache.flink:flink-table-api-java-bridge:${flinkVersion}"
    shadow "org.apache.flink:flink-table-planner_${scalaBinaryVersion}:${flinkVersion}"
    shadow "org.apache.flink:flink-table-common:${flinkVersion}"
}

// TODO - do I need this?
ext.javaExerciseClassName = 'org.apache.flink.training.exercises.hourlytips.HourlyTipsExercise'
ext.javaSolutionClassName = 'org.apache.flink.training.solutions.hourlytips.HourlyTipsSolution'
mainClassName = ext.javaExerciseClassName
