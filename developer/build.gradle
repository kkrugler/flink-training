plugins {
    id 'base'
}

// Create a zip of just the required files for students.
tasks.register('zip', Zip) {
    archiveFileName = "flink-training-developer.zip"
    destinationDirectory = layout.buildDirectory

    from(layout.projectDirectory) {
        exclude("state-processor")
    }

    from(layout.projectDirectory.dir("..")) {
        include("troubleshooting/common/**")
        include("troubleshooting/introduction/**")
        include("troubleshooting/build.gradle")
        include("README-Developer.md")
    }

    exclude("**/build")
    exclude("**/.*")
}

// Set up so build will create the bootcamp zip file
tasks.named('assemble') {
    subprojects.each {
        dependsOn(":$it.name:test")
    }
    dependsOn(zip)
}
